name: Fon fiyatlarını güncelle
on:
  push:
    paths:
      - ".github/workflows/fund-prices.yml"
      - "scripts/fetch_fund.py"
  schedule:
    - cron: "30 15 * * 1-5"
    - cron: "30 18 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_fund.py
        env:
          FUND: VFK
      - name: Değiştiyse kaydet
        run: |
          git config user.name "fund-bot"
          git config user.email "fund-bot@users.noreply.github.com"
          git add fund-prices.json fund-status.json
          git diff --cached --quiet || (git commit -m "Fon fiyatları güncellendi" && git pull --rebase -q && git push)
