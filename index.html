<style>
:root{
  --bg:#000000; --surface:#131315; --surface2:#1C1C20; --line:rgba(255,255,255,.09);
  --acc:#D4FF3F; --acc-dim:rgba(212,255,63,.14);
  --red:#FF5C5C; --amber:#E8C84B;
  --text:#F5F5F5; --text-dim:rgba(255,255,255,.46); --text-faint:rgba(255,255,255,.26);
  --ink:255,255,255; --on-acc:#000; --tabbar:rgba(19,19,21,.98);
  --font-ui:'Sora',-apple-system,BlinkMacSystemFont,sans-serif; --font-num:'DM Mono',ui-monospace,monospace;
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none; position:fixed; inset:0; width:100%;}
body{background:var(--bg); color:var(--text); font-family:var(--font-ui); -webkit-font-smoothing:antialiased;}
input,button,select{font-family:inherit;}
.phone{position:fixed; top:0; left:0; right:0; margin:0 auto; width:100%; max-width:460px; height:100%; height:var(--app-h,100%); display:flex; flex-direction:column; overflow:hidden;}

.topbar{display:flex; align-items:center; justify-content:space-between; padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px;}
.brand{display:flex; align-items:center; gap:8px;}
.brand img{width:24px; height:24px; border-radius:7px; display:block;}
.app-name{font-size:12.5px; font-weight:600; color:var(--text-dim); letter-spacing:.03em;}
.topbar .icons{display:flex; align-items:center; gap:10px;}
.sync-dot{width:9px; height:9px; border-radius:50%; background:var(--text-faint); border:none; padding:0; cursor:pointer;}
.sync-dot.ok{background:var(--acc);}
.sync-dot.saving,.sync-dot.loading{background:var(--amber); animation:pulseS 1s ease-in-out infinite;}
.sync-dot.error{background:var(--red); animation:none;}
@keyframes pulseS{0%,100%{opacity:1;}50%{opacity:.35;}}
.gear{width:26px; height:26px; border-radius:8px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text-dim); cursor:pointer;}

.topbar{flex:none;}
.screen{display:none; flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:4px 18px 28px; scrollbar-width:thin; scrollbar-color:var(--acc-dim) transparent;}
.screen::-webkit-scrollbar{width:5px;}
.screen::-webkit-scrollbar-thumb{background:var(--acc-dim); border-radius:4px;}
.screen::-webkit-scrollbar-thumb:hover{background:var(--acc);}
.screen.active{display:block;}

.hero-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px 20px; margin-top:6px;}
.hero-label{font-size:11.5px; color:var(--text-dim); font-weight:600; letter-spacing:.02em;}
.hero-num{font-family:var(--font-num); font-size:30px; font-weight:500; margin-top:8px; letter-spacing:-.01em;}
.hero-prog{margin-top:14px;}
.hero-prog .track{height:6px; background:var(--surface2); border-radius:4px; overflow:hidden;}
.hero-prog .fill{height:100%; background:var(--acc); border-radius:4px;}
.hero-prog .meta{display:flex; justify-content:space-between; margin-top:7px; font-size:10.5px; color:var(--text-dim);}
.hero-prog .meta b{color:var(--text); font-weight:500; font-family:var(--font-num);}

.stat-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:16px;}
.stat-row.c2{grid-template-columns:1fr 1fr;}
.stat-mini{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 10px;}
.stat-mini .l{font-size:10px; color:var(--text-dim);}
.stat-mini .l small{display:block; font-size:8.5px; color:var(--text-faint); font-weight:400; margin-top:1px;}
.stat-mini .v{font-family:var(--font-num); font-size:14px; margin-top:4px;}
.stat-mini.tap{cursor:pointer; border-style:dashed; border-color:var(--acc-dim);}
.stat-mini.tap .v{color:var(--acc);}

.save-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:12px; display:flex; justify-content:space-between; align-items:center;}
.save-card .l{font-size:12px; color:var(--text-dim); font-weight:600;}
.save-card .s{font-size:9.5px; color:var(--text-faint); margin-top:3px;}
.save-card .v{font-family:var(--font-num); font-size:18px; color:var(--acc); white-space:nowrap; margin-left:10px;}

.section-title{font-size:12.5px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin:22px 0 10px;}

.todo-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:6px 16px; margin-top:6px;}
.todo-row{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
.todo-row:last-child{border-bottom:none;}
.todo-row .tick{width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line); flex:none; background:none;}
.todo-row .tick.on{background:var(--acc); border-color:var(--acc);}
.todo-row .nm{flex:1; font-size:12.5px; text-align:left;}
.todo-row .nm small{display:block; font-size:9.5px; color:var(--text-faint); margin-top:1px; font-weight:400;}
.todo-row .amt{font-family:var(--font-num); font-size:12.5px; color:var(--text-dim);}
.todo-head{display:flex; justify-content:space-between; align-items:baseline;}
.todo-head .cnt{font-size:11px; color:var(--acc); font-family:var(--font-num);}
.empty-note{font-size:11px; color:var(--text-faint); padding:14px 0; text-align:center;}

.chart-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px;}
.trend-wrap{position:relative;}
.trend-wrap svg{display:block; width:100%; height:76px; overflow:visible;}
.trend-now-lab{position:absolute; font-size:9.5px; color:var(--acc); font-family:var(--font-num); background:var(--bg); padding:2px 6px; border-radius:6px; border:1px solid var(--line); transform:translate(-50%,-130%); white-space:nowrap;}
.trend-lab{display:flex; justify-content:space-between; margin-top:8px; font-size:9.5px; color:var(--text-faint);}

.split-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:10px;}
.split-track{display:flex; height:8px; border-radius:5px; overflow:hidden; margin:10px 0 12px; background:var(--surface2);}
.split-legend{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px;}
.split-legend div{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim);}
.split-legend i{width:7px; height:7px; border-radius:2px; flex:none;}

.year-picker{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
.year-picker .yr{flex:1; min-width:64px; padding:9px 0; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text-dim); font-size:13px; font-weight:600;}
.year-picker .yr.active{background:var(--acc); border-color:var(--acc); color:var(--on-acc);}
.year-grid{display:none; margin-top:16px;}
.year-grid.active{display:block;}
.month-grid{display:flex; flex-wrap:wrap; gap:7px;}
.month-chip2{min-width:50px; flex:0 0 auto; padding:8px 4px; border-radius:11px; text-align:center; background:var(--surface); border:1px solid var(--line); font-size:11px; color:var(--text-dim);}
.month-chip2 .d{width:5px; height:5px; border-radius:50%; background:var(--text-faint); margin:4px auto 0;}
.month-chip2.done{color:var(--text);}
.month-chip2.done .d{background:var(--acc);}
.month-chip2.off{opacity:.35;}
.month-chip2.off .d{background:transparent; border:1px solid var(--text-faint);}
.month-chip2.now{background:var(--acc-dim); border-color:var(--acc); color:var(--acc);}
.month-chip2.now .d{background:var(--acc);}

  var THEME_ORDER = ['krem','sis','lacivert','antrasit','orman','siyah'];
  var OLD_MONTHS = ['Ağustos','Eylül','Ekim','Kasım','Aralık','Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz'];

  function keyFromAbsIndex(idx){
    var total = (EPOCH_YEAR*12 + (EPOCH_MONTH-1)) + idx;
    var y = Math.floor(total/12), m = total%12 + 1;
    return y + '-' + String(m).padStart(2,'0');
  }
  function absIndexFromKey(key){
    var parts = key.split('-'); var y = Number(parts[0]), m = Number(parts[1]);
    return (y*12 + (m-1)) - (EPOCH_YEAR*12 + (EPOCH_MONTH-1));
  }
  function keysBetween(fromKey, toKey){
    var a = absIndexFromKey(fromKey), b = absIndexFromKey(toKey);
    var out = [];
    for(var i=a;i<=b;i++) out.push(keyFromAbsIndex(i));
    return out;
  }
  function monthNameFromKey(key){ return MONTH_NAMES[Number(key.split('-')[1])-1]; }
  function monthAbbrFromKey(key){ return MONTH_ABBR2[monthNameFromKey(key)]; }
  function yearFromKey(key){ return Number(key.split('-')[0]); }
  function addMonths(key, n){ return keyFromAbsIndex(absIndexFromKey(key)+n); }
  function keysForYear(y){
    var out = [];
    for(var m=1;m<=12;m++) out.push(y+'-'+String(m).padStart(2,'0'));
    return out;
  }
  function migrateOldIndexToKey(oldIdx){ return keyFromAbsIndex(oldIdx + 2); }
  function todayKey(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function fmtKeyShort(key){ return monthAbbrFromKey(key)+" '"+String(yearFromKey(key)).slice(2); }

  var uidCounter = 1;
  function uid(){ return 'id'+(uidCounter++)+'_'+Math.random().toString(36).slice(2,7); }
  function hasOwn(o,k){ return Object.prototype.hasOwnProperty.call(o||{},k); }
  function parseNum(str){
    if(str===null||str===undefined) return 0;
    str=String(str).trim(); if(str==='') return 0;
    str=str.replace(/\./g,'').replace(',', '.');
    var v=parseFloat(str); return isNaN(v)?0:v;
  }
  function fmt(n){
    var num=Number(n); if(isNaN(num)) return '—';
    return num.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL';
  }
  function fmtShort(n){
    var num=Number(n); if(isNaN(num)) return '—';
    return num.toLocaleString('tr-TR',{maximumFractionDigits:0})+' TL';
  }
  function editVal(n){ return Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* ===================== DURUM MODELİ ===================== */
  function defaultState(){
    return {
      epoch: EPOCH_KEY,
      salaryDefault:{netMaas:0, sendika:0, aile:0, pazarRate:0, mesaiRate:0},

      offBudgetExpenses:{}, recurringOb:[], sectionOrder:['expenses','faturalar','offbudget','kk','kmh','kredi','manuel','ek','savings'],
      savings:{rate:3.1, rateByMonth:{}, deposits:{}, fund:{code:'VFK', prices:{}, ts:0, src:'', off:false, lag:1}},
      gold:{prices:{k22:{alis:0,satis:0}, k24:{alis:0,satis:0}, s1:{fiyat:0, ratio:0, est:false, src:''}, ts:null, src:''}, entries:{}},
      theme:{name:'siyah', accent:'#D4FF3F'}
    };
  }

  function fieldMonthly(d, field, key){
    var m = d[field+'ByMonth'];
    if(m && hasOwn(m,key) && m[key]!==null && m[key]!==undefined && m[key]!=='') return Number(m[key]);
    return Number(d[field]||0);
  }
  function setFieldMonthly(d, field, key, value){
    if(!d[field+'ByMonth']) d[field+'ByMonth'] = {};
    if(value===null || value===undefined || value===''){ delete d[field+'ByMonth'][key]; }
    else d[field+'ByMonth'][key] = value;
  }
  function fieldIsOverridden(d, field, key){
    var m = d[field+'ByMonth'];
    return !!(m && hasOwn(m,key) && m[key]!==null && m[key]!==undefined && m[key]!=='');
  }
  function salaryFieldFor(STATE, field, key){
    var m = STATE.salaryDefaultByMonth[key];
    if(m && hasOwn(m,field) && m[field]!==null && m[field]!==undefined && m[field]!=='') return Number(m[field]);
    return Number(STATE.salaryDefault[field]||0);
  }
  function setSalaryField(STATE, field, key, value){
    if(!STATE.salaryDefaultByMonth[key]) STATE.salaryDefaultByMonth[key] = {};
    if(value===null||value===undefined||value===''){ delete STATE.salaryDefaultByMonth[key][field]; }
    else STATE.salaryDefaultByMonth[key][field] = value;
  }

  function billAmountForMonth(f, key){
    if(f.monthlyAmounts && hasOwn(f.monthlyAmounts,key)) return Number(f.monthlyAmounts[key]||0);
    if(f.repeat && absIndexFromKey(key) >= absIndexFromKey(f.startMonthKey||EPOCH_KEY)) return Number(f.repeatAmount||0);
    return 0;
  }
  // Her ay tekrar eden hesap dışı kalemleri, bugünden 36 ay ilerisine kadar aylara işler (kimlikler sabit, çift kayıt olmaz)
  function ensureRecurring(S){
    var t0 = todayKey(); if(absIndexFromKey(t0) < 0) t0 = EPOCH_KEY;
    var endAll = addMonths(t0, 36);
    (S.recurringOb||[]).forEach(function(t){
      var last = (t.endMonthKey && absIndexFromKey(t.endMonthKey) < absIndexFromKey(endAll)) ? t.endMonthKey : endAll;
      if(absIndexFromKey(t.startMonthKey) > absIndexFromKey(last)) return;
      keysBetween(t.startMonthKey, last).forEach(function(k){
        if(t.skip && t.skip[k]) return;
        var arr = S.offBudgetExpenses[k] || [];
        if(arr.some(function(i){return i.recurId===t.id;})) return;
        arr.push({id:'r_'+t.id+'_'+k, ad:t.ad, tutar:Number(t.tutar||0), paid:false, recurId:t.id});
        S.offBudgetExpenses[k] = arr;
      });
    });
  }
  function transferredBillsForCard(STATE, cardId, targetKey){
    return STATE.faturalar.reduce(function(total,f){
      var transfers = f.cardTransfers || {};
      return total + Object.keys(transfers).reduce(function(sub,key){
        var tr = transfers[key];
        return sub + (tr && tr.cardId===cardId && tr.targetMonth===targetKey ? Number(tr.amount||0) : 0);
      },0);
    },0);
  }
  function transferredOffBudgetForCard(STATE, cardId, targetKey){
    var total = 0;
    Object.keys(STATE.offBudgetExpenses||{}).forEach(function(mk){
      (STATE.offBudgetExpenses[mk]||[]).forEach(function(item){
        var tr = item.cardTransfer;
        if(tr && tr.cardId===cardId && tr.targetMonth===targetKey) total += Number(tr.amount||0);
      });
    });
    return total;
  }
  function additionsForDebt(STATE, d, key){
    return Number((d.additions && d.additions[key])||0) + transferredBillsForCard(STATE,d.id,key) + transferredOffBudgetForCard(STATE,d.id,key);
  }

  function calcDebtSeries(STATE, d, uptoKey){
    if(absIndexFromKey(d.startMonthKey) > absIndexFromKey(uptoKey)) return {balances:{},paid:{},suggested:{},carryIn:{},carryOut:{},keys:[]};
    var keys = keysBetween(d.startMonthKey, uptoKey);
    var balances={}, paid={}, suggested={}, carryIn={}, carryOut={}, pendIn={}, pendOut={};
    var bal = Number(d.baslangic||0);
    var pend = 0;       // kart: önceki ayda yapılan, bu ay borç olarak başlayan harcama
    var carry = 0;      // önceki aydan ertelenen (ödenemeyen) tutar
    var prepaid = 0;    // kredide peşin ödenen taksit tutarı (sonraki taksitlerden düşer)
    keys.forEach(function(key){
      var payment, sugg;
      var hasOv = !!(d.payments && hasOwn(d.payments,key));
      var missed = !!(d.missedMonths && d.missedMonths[key]);
      carryIn[key] = carry;
      if(d.tur === 'kredi_karti'){
        var eskiBakiye = bal;                 // eksi ise: karta fazla yatırılmış tutar (alacak)
        var eklenen = additionsForDebt(STATE,d,key);
        var eklenenManuel = Number((d.additions && d.additions[key])||0);
        var eklenenAktar = eklenen - eklenenManuel;   // faturadan/hesap dışından karta aktarılan: seçilen hedef ayda borca girer
        var faizYuzdeVal = fieldMonthly(d,'faizYuzde',key);
        var asgariYuzdeVal = fieldMonthly(d,'asgariYuzde',key);
        // Harcama kuralı: borç ödendikten sonra "Harcama" alanına yazılan tutar bu ayın bakiyesine/ödemesine girmez,
        // sonraki ayın başında borç olarak devreder. Aktarılan fatura/giderler ise zaten seçilen hedef aya yazılır,
        // onlar kaydırılmaz. (spendNextFrom öncesi aylar eski hesabı korur.)
        var sonrakiAy = absIndexFromKey(key) >= absIndexFromKey(STATE.spendNextFrom||EPOCH_KEY);
        if(sonrakiAy){
          var basla0 = eskiBakiye + pend;     // geçen ayın harcaması bu ay borç olarak başlar
          pendIn[key] = pend;
          var faizTutari = Math.max(0,basla0)*(faizYuzdeVal/100);
          var basla = basla0 + eklenenAktar;
          sugg = Math.max(0,basla)*(asgariYuzdeVal/100) + faizTutari + carry;
          var due = hasOv ? Number(d.payments[key]) : sugg;
          payment = missed ? 0 : due;
          carryOut[key] = missed ? due : 0;
          bal = basla + faizTutari - payment;  // bu ayın harcaması hariç; sonraki aya devreder
          pend = eklenenManuel; pendOut[key] = eklenenManuel;
        } else {
          pendIn[key] = 0; pendOut[key] = 0; pend = 0;
          bal = eskiBakiye + eklenen;           // yeni harcama önce alacaktan düşer
          var faizTutari0 = Math.max(0,eskiBakiye)*(faizYuzdeVal/100);
          var faizli = bal + faizTutari0;
          sugg = Math.max(0,bal)*(asgariYuzdeVal/100) + faizTutari0 + carry;
          var due0 = hasOv ? Number(d.payments[key]) : sugg;
          payment = missed ? 0 : due0;
          carryOut[key] = missed ? due0 : 0;
          bal = faizli-payment;                 // fazla ödeme 0'a kırpılmaz, sonraki aya alacak olarak geçer
        }
      } else if(d.tur === 'kmh'){
        bal += additionsForDebt(STATE,d,key);
        var faizK = fieldMonthly(d,'faizYuzde',key);
        var faizliK = bal*(1+(faizK/100));
        sugg = bal*(faizK/100) + carry;
        var dueK = hasOv ? Number(d.payments[key]) : sugg;
        payment = missed ? 0 : dueK;
        carryOut[key] = missed ? dueK : 0;
        bal = Math.max(0, faizliK-payment);
      } else if(d.tur === 'kredi'){
        bal += additionsForDebt(STATE,d,key);
        var taksitVal = fieldMonthly(d,'taksit',key);
        var sugg0 = Math.min(taksitVal, bal);
        var afterPre = Math.max(0, sugg0 - prepaid);          // peşin ödenen taksitler düşüldükten sonra
        var newPrepaid = Math.max(0, prepaid - sugg0);
        sugg = Math.min(bal, afterPre + carry);
        var dueC = hasOv ? Number(d.payments[key]) : sugg;
        payment = missed ? 0 : dueC;
        carryOut[key] = missed ? dueC : 0;
        // taksitten fazla ödenen kısım, sonraki ayların taksitlerini karşılar
        prepaid = newPrepaid + (missed ? 0 : Math.max(0, payment - sugg));
        bal = Math.max(0, bal-payment);
      } else {
        bal += additionsForDebt(STATE,d,key);
        sugg = carry;
        var dueM = hasOv ? Number(d.payments[key]) : sugg;
        payment = missed ? 0 : dueM;
        carryOut[key] = missed ? dueM : 0;
        bal = Math.max(0, bal-payment);
      }
      carry = carryOut[key];
      if(d.balanceOverrides && hasOwn(d.balanceOverrides,key)) bal = Math.max(0, Number(d.balanceOverrides[key]||0));
      balances[key]=bal; paid[key]=payment; suggested[key]=sugg;
    });
    return {balances:balances, paid:paid, suggested:suggested, carryIn:carryIn, carryOut:carryOut, pendIn:pendIn, pendOut:pendOut, keys:keys};
  }
  function calcEkSeries(STATE, d, uptoKey){
    if(absIndexFromKey(d.startMonthKey) > absIndexFromKey(uptoKey)) return {balances:{},paid:{},carryIn:{},carryOut:{},keys:[]};
    var keys = keysBetween(d.startMonthKey, uptoKey);
    var balances={}, paid={}, carryIn={}, carryOut={};
    var bal = Number(d.baslangic||0);
    var carry = 0;
    keys.forEach(function(key){
      bal += Number((d.additions && d.additions[key])||0);
      var missed = !!(d.missedMonths && d.missedMonths[key]);
      carryIn[key] = carry;
      var due = (d.payments && hasOwn(d.payments,key)) ? Number(d.payments[key]) : carry;
      var payment = missed ? 0 : due;
      carryOut[key] = missed ? due : 0;
      carry = carryOut[key];
      bal = Math.max(0, bal-payment);
      if(d.balanceOverrides && hasOwn(d.balanceOverrides,key)) bal = Math.max(0, Number(d.balanceOverrides[key]||0));
      balances[key]=bal; paid[key]=payment;
    });
    return {balances:balances, paid:paid, carryIn:carryIn, carryOut:carryOut, keys:keys};
  }
  function sortedVisible(list){ return list.filter(function(d){return !d.hidden;}); }
  function computeGrandTotal(STATE, uptoKey){
    var total = 0;
    STATE.debts.forEach(function(d){
      if(absIndexFromKey(d.startMonthKey) > absIndexFromKey(uptoKey)) return;
      total += calcDebtSeries(STATE,d,uptoKey).balances[uptoKey] || 0;
    });
    STATE.ekBorclular.forEach(function(d){
      if(absIndexFromKey(d.startMonthKey) > absIndexFromKey(uptoKey)) return;
      total += calcEkSeries(STATE,d,uptoKey).balances[uptoKey] || 0;
    });
    return total;
  }
  function totalStartValue(STATE){
    return STATE.debts.reduce(function(s,d){return s+Number(d.baslangic||0);},0) +
           STATE.ekBorclular.reduce(function(s,d){return s+Number(d.baslangic||0);},0);
  }
  function thisYearNewDebtOutstanding(STATE, uptoKey){
    var yStart = yearFromKey(EPOCH_KEY) + '-01';
    var total = 0;
    [STATE.debts, STATE.ekBorclular].forEach(function(list){
      list.forEach(function(d){
        if(absIndexFromKey(d.startMonthKey) < absIndexFromKey(EPOCH_KEY)) return;
        if(absIndexFromKey(d.startMonthKey) > absIndexFromKey(uptoKey)) return;
        var ser = d.tur ? calcDebtSeries(STATE,d,uptoKey) : calcEkSeries(STATE,d,uptoKey);
        total += ser.balances[uptoKey] || 0;
      });
    });
    return total;
  }
  function monthFullyClosed(STATE, key){
    var debtsOk = sortedVisible(STATE.debts).every(function(d){
      return absIndexFromKey(key) < absIndexFromKey(d.startMonthKey) || !!(d.paidMonths && d.paidMonths[key]) || !!(d.missedMonths && d.missedMonths[key]);
    });
    if(!debtsOk) return false;
    var ekOk = sortedVisible(STATE.ekBorclular).every(function(d){
      return absIndexFromKey(key) < absIndexFromKey(d.startMonthKey) || !!(d.paidMonths && d.paidMonths[key]) || !!(d.missedMonths && d.missedMonths[key]);
    });
    if(!ekOk) return false;
    var expOk = STATE.expenses.every(function(e){
      return absIndexFromKey(key) < absIndexFromKey(e.startMonthKey||EPOCH_KEY) || !!(e.paidMonths && e.paidMonths[key]);
    });
    if(!expOk) return false;
    var faturaOk = STATE.faturalar.every(function(f){
      if(absIndexFromKey(key) < absIndexFromKey(f.startMonthKey||EPOCH_KEY)) return true;
      var tr = (f.cardTransfers||{})[key];
      return !!tr || !!(f.paidMonths && f.paidMonths[key]);
    });
    if(!faturaOk) return false;
    var offOk = (STATE.offBudgetExpenses[key]||[]).every(function(item){ return !!item.cardTransfer || !!item.paid; });
    return offOk;
  }
  function firstOpenKey(STATE, horizonKey){
    var keys = keysBetween(EPOCH_KEY, horizonKey);
    for(var i=0;i<keys.length;i++){ if(!monthFullyClosed(STATE,keys[i])) return keys[i]; }
    return addMonths(horizonKey,1);
  }

  /* ===================== NORMALİZE ===================== */
  var GOLD_KINDS = {k22:{label:'22 Ayar', unit:'gr'}, k24:{label:'24 Ayar', unit:'gr'}, s1:{label:'Altın S1', unit:'lot'}};
  var GOLD_ORDER = ['k22','k24','s1'];
  function normalizeState(parsed){
    var def = defaultState();
    var out = Object.assign({}, def, parsed||{});
    out.salaryDefault = Object.assign({}, def.salaryDefault, (parsed&&parsed.salaryDefault)||{});
    out.salaryDefaultByMonth = (parsed&&parsed.salaryDefaultByMonth)||{};
    out.spendNextFrom = EPOCH_KEY; // kart harcaması kuralı takibin başından (Haziran 2026) itibaren geçerli: Harcama alanı sonraki ayın borcuna yazılır
    out.salaryMonthly = (parsed&&parsed.salaryMonthly)||{};
    out.debts = (Array.isArray(out.debts)?out.debts:[]).map(function(d,idx){
      return Object.assign({}, d, {
        payments:d.payments||{}, balanceOverrides:d.balanceOverrides||{}, additions:d.additions||{},
        paidMonths:d.paidMonths||{}, missedMonths:d.missedMonths||{}, hidden:!!d.hidden,
        sortOrder:(typeof d.sortOrder==='number')?d.sortOrder:idx,
        startMonthKey:d.startMonthKey||EPOCH_KEY
      });
    });
    out.ekBorclular = (Array.isArray(out.ekBorclular)?out.ekBorclular:[]).map(function(d,idx){
      return Object.assign({}, d, {
        payments:d.payments||{}, balanceOverrides:d.balanceOverrides||{}, additions:d.additions||{},
        paidMonths:d.paidMonths||{}, missedMonths:d.missedMonths||{}, hidden:!!d.hidden,
        sortOrder:(typeof d.sortOrder==='number')?d.sortOrder:idx,
        startMonthKey:d.startMonthKey||EPOCH_KEY
      });
    });
    out.expenses = (Array.isArray(out.expenses)?out.expenses:[]).map(function(e,idx){
      return Object.assign({}, e, {
        monthlyAmounts:e.monthlyAmounts||{}, paidMonths:e.paidMonths||{},
        startMonthKey:e.startMonthKey||EPOCH_KEY, sortOrder:(typeof e.sortOrder==='number')?e.sortOrder:idx
      });
    });
    out.faturalar = (Array.isArray(out.faturalar)?out.faturalar:[]).map(function(f,idx){
      return Object.assign({}, f, {
        monthlyAmounts:f.monthlyAmounts||{}, cardTransfers:f.cardTransfers||{}, paidMonths:f.paidMonths||{},
        startMonthKey:f.startMonthKey||EPOCH_KEY, sortOrder:(typeof f.sortOrder==='number')?f.sortOrder:idx
      });
    });
    out.offBudgetExpenses = (parsed&&parsed.offBudgetExpenses) || {};
    Object.keys(out.offBudgetExpenses).forEach(function(mk){
      out.offBudgetExpenses[mk] = (out.offBudgetExpenses[mk]||[]).map(function(item){
        return Object.assign({}, item, {id:item.id||uid(), ad:item.ad||'Yeni Harcama', tutar:Number(item.tutar||0), paid:!!item.paid});
      });
    });
    out.recurringOb = (Array.isArray(out.recurringOb)?out.recurringOb:[]).map(function(t){
      return Object.assign({endMonthKey:null}, t, {skip:t.skip||{}});
    });
    ensureRecurring(out);
    out.sectionOrder = Array.isArray(out.sectionOrder) ? out.sectionOrder : ['expenses','faturalar','offbudget','kk','kmh','kredi','manuel','ek','savings'];
    var sv = (parsed&&parsed.savings)||{};
    out.savings = {rate:(typeof sv.rate==='number'&&sv.rate>=0)?sv.rate:3.1, rateByMonth:sv.rateByMonth||{}, deposits:sv.deposits||{}};
    var fd = sv.fund||{}, fpr = {};
    Object.keys(fd.prices||{}).forEach(function(dk){ var v = Number(fd.prices[dk]); if(/^\d{4}-\d{2}-\d{2}$/.test(dk) && v>0) fpr[dk] = v; });
    out.savings.fund = {code:String(fd.code||'VFK').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8)||'VFK', prices:fpr, ts:Number(fd.ts||0), src:String(fd.src||''), off:!!fd.off, lag:(fd.lag===0?0:1)};
    var gd = (parsed&&parsed.gold)||{}, gp = gd.prices||{};
    function pr(o,a,b){ o=o||{}; var r={}; r[a]=Number(o[a]||0); if(b) r[b]=Number(o[b]||0); return r; }
    var s1p = pr(gp.s1,'fiyat'); s1p.ratio = Number((gp.s1||{}).ratio||0); s1p.est = !!(gp.s1||{}).est; s1p.src = String((gp.s1||{}).src||'');
    out.gold = {prices:{k22:pr(gp.k22,'alis','satis'), k24:pr(gp.k24,'alis','satis'), s1:s1p, ts:gp.ts||null, src:gp.src||''}, entries:gd.entries||{}};
    Object.keys(out.gold.entries).forEach(function(mk){
      out.gold.entries[mk] = (out.gold.entries[mk]||[]).filter(function(x){return GOLD_KINDS[x.kind];}).map(function(x){ return {id:x.id||uid(), kind:x.kind, qty:Number(x.qty||0), price:Number(x.price||0)}; });
    });
    Object.keys(out.savings.deposits).forEach(function(mk){
      out.savings.deposits[mk] = (out.savings.deposits[mk]||[]).map(function(x){ var o = {id:x.id||uid(), tutar:Number(x.tutar||0)}; var g = Math.round(Number(x.gun)); if(g>=1 && g<=31) o.gun = g; var ad = Number(x.adet); if(isFinite(ad) && ad!==0){ o.adet = ad; var fx = Number(x.fiyat); if(fx>0) o.fiyat = fx; } return o; });
    });
    refreshAdet(out.savings);
    out.theme = Object.assign({name:'siyah', accent:'#D4FF3F'}, (parsed&&parsed.theme)||{});
    if(!THEMES[out.theme.name]) out.theme.name = 'siyah';
    return out;
  }

  /* ===================== ESKİ VERİDEN GÖÇ ===================== */
  function migrateFromOldState(old){
    var ns = defaultState();
    if(old.salaryFixed) ns.salaryDefault = {
      netMaas:Number(old.salaryFixed.netMaas||0), sendika:Number(old.salaryFixed.sendika||0),
      aile:Number(old.salaryFixed.aile||0), pazarRate:Number(old.salaryFixed.pazarRate||0), mesaiRate:Number(old.salaryFixed.mesaiRate||0)
    };
    if(old.salaryMonthly){
      OLD_MONTHS.forEach(function(name,i){
        var v = old.salaryMonthly[name];
        if(v) ns.salaryMonthly[migrateOldIndexToKey(i)] = {pazarGun:Number(v.pazarGun||0), mesaiSaat:Number(v.mesaiSaat||0)};
      });
    }
    function migrateByMonthArr(arr){
      var o = {};
      if(Array.isArray(arr)) arr.forEach(function(v,i){ if(v!==undefined&&v!==null) o[migrateOldIndexToKey(i)]=v; });
      return o;
    }
    function migrateIdxKeyedObj(obj){
      var o = {};
      if(obj) Object.keys(obj).forEach(function(k){ var i=Number(k); if(!isNaN(i)) o[migrateOldIndexToKey(i)] = obj[k]; });
      return o;
    }
    (old.debts||[]).forEach(function(d){
      var nd = Object.assign({}, d);
      nd.startMonthKey = migrateOldIndexToKey(Number(d.startMonthIndex||0));
      nd.payments = migrateIdxKeyedObj(d.payments);
      nd.balanceOverrides = migrateIdxKeyedObj(d.balanceOverrides);
      nd.additions = migrateIdxKeyedObj(d.additions);
      nd.paidMonths = migrateIdxKeyedObj(d.paidMonths);
      nd.missedMonths = migrateIdxKeyedObj(d.missedMonths);
      ['taksit','faizYuzde','asgariYuzde'].forEach(function(f){
        if(Array.isArray(d[f+'Monthly'])) nd[f+'ByMonth'] = migrateByMonthArr(d[f+'Monthly']);
      });
      delete nd.startMonthIndex; delete nd.taksitMonthly; delete nd.faizYuzdeMonthly; delete nd.asgariYuzdeMonthly;
      ns.debts.push(nd);
    });
    (old.ekBorclular||[]).forEach(function(d){
      var nd = Object.assign({}, d);
      nd.startMonthKey = migrateOldIndexToKey(Number(d.startMonthIndex||0));
      nd.payments = migrateIdxKeyedObj(d.payments);
      nd.balanceOverrides = migrateIdxKeyedObj(d.balanceOverrides);
      nd.additions = migrateIdxKeyedObj(d.additions);
      nd.paidMonths = migrateIdxKeyedObj(d.paidMonths);
      nd.missedMonths = migrateIdxKeyedObj(d.missedMonths);
      delete nd.startMonthIndex;
      ns.ekBorclular.push(nd);
    });
    (old.expenses||[]).forEach(function(e){
      var ne = Object.assign({}, e);
      ne.startMonthKey = migrateOldIndexToKey(0);
      ne.monthlyAmounts = migrateByMonthArr(e.monthlyAmounts);
      ne.paidMonths = migrateIdxKeyedObj(e.paidMonths);
      delete ne.tutar;
      ns.expenses.push(ne);
    });
    (old.faturalar||[]).forEach(function(f){
      var nf = Object.assign({}, f);
      nf.startMonthKey = migrateOldIndexToKey(0);
      nf.monthlyAmounts = migrateByMonthArr(f.monthlyAmounts);
      nf.paidMonths = migrateIdxKeyedObj(f.paidMonths);
      var ct = {};
      if(f.cardTransfers) Object.keys(f.cardTransfers).forEach(function(k){
        var tr = f.cardTransfers[k]; var i=Number(k);
        ct[migrateOldIndexToKey(i)] = {cardId:tr.cardId, amount:tr.amount, targetMonth:migrateOldIndexToKey(Number(tr.targetMonth))};
      });
      nf.cardTransfers = ct;
      delete nf.tutar;
      ns.faturalar.push(nf);
    });
    if(old.offBudgetExpenses){
      old.offBudgetExpenses.forEach(function(items,i){
        var newKey = migrateOldIndexToKey(i);
        ns.offBudgetExpenses[newKey] = (items||[]).map(function(item){
          var ni = Object.assign({}, item);
          if(item.cardTransfer){
            ni.cardTransfer = {cardId:item.cardTransfer.cardId, amount:item.cardTransfer.amount, targetMonth:migrateOldIndexToKey(Number(item.cardTransfer.targetMonth))};
          }
          return ni;
        });
      });
    }
    return ns;

    var items = [];
    sortedVisibleDebts().forEach(function(d){
      if(absIndexFromKey(hk) < absIndexFromKey(d.startMonthKey)) return;

  function drawTrend(vals, nowI){
    var svg = document.getElementById('trendSvg');
    if(!svg || !vals.length) return;
    var W=300,H=76,padT=10,padB=10;
    var minV=Math.min.apply(null,vals), maxV=Math.max.apply(null,vals);
    if(minV===maxV) maxV = minV+1;
    var pts = vals.map(function(v,i){
      var x = vals.length>1 ? (i/(vals.length-1))*W : 0;
      var y = padT + (1-(v-minV)/(maxV-minV))*(H-padT-padB);
      return [x,y];
    });
    var lineStr = pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');

  var _fundTL = null;

  function fundPrice(iso){

  function parseTefasJson(txt, code){

      var txt = String(t).replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ');

      if(r0.ok){
        var j0 = await r0.json(), c0 = 0, m0 = {};

  function computeMonthTotals(key){
    var sal = STATE.salaryDefault;
    var pazarGun = (STATE.salaryMonthly[key]&&STATE.salaryMonthly[key].pazarGun)||0;
    var mesaiSaat = (STATE.salaryMonthly[key]&&STATE.salaryMonthly[key].mesaiSaat)||0;
    var gelir = salaryFieldFor(STATE,'netMaas',key)+salaryFieldFor(STATE,'sendika',key)+salaryFieldFor(STATE,'aile',key)
      + pazarGun*salaryFieldFor(STATE,'pazarRate',key) + mesaiSaat*salaryFieldFor(STATE,'mesaiRate',key);
    var debtDue = 0;
    sortedVisible(STATE.debts).forEach(function(d){
      if(absIndexFromKey(key) < absIndexFromKey(d.startMonthKey)) return;
      debtDue += calcDebtSeries(STATE,d,key).paid[key]||0;
    });
    sortedVisible(STATE.ekBorclular).forEach(function(d){
      if(absIndexFromKey(key) < absIndexFromKey(d.startMonthKey)) return;
      debtDue += calcEkSeries(STATE,d,key).paid[key]||0;
    });
    var faturaTotal = STATE.faturalar.reduce(function(s,f){
      if(absIndexFromKey(key) < absIndexFromKey(f.startMonthKey||EPOCH_KEY)) return s;
      var tr=(f.cardTransfers||{})[key]; if(tr) return s;
      return s+billAmountForMonth(f,key);
    },0);
    var expTotal = STATE.expenses.reduce(function(s,e){
      if(absIndexFromKey(key) < absIndexFromKey(e.startMonthKey||EPOCH_KEY)) return s;
      return s+billAmountForMonth(e,key);
    },0);
    var offTotal = (STATE.offBudgetExpenses[key]||[]).reduce(function(s,i){return s+(i.cardTransfer?0:Number(i.tutar||0));},0);
    // Birikime yatırılan tutar maaştan kalandan düşer (çekim ise kalana eklenir)
    var savDep = ((STATE.savings&&STATE.savings.deposits&&STATE.savings.deposits[key])||[]).reduce(function(a,x){return a+Number(x.tutar||0);},0);
    // Altın / sertifika alımı kendi aldığın fiyattan maaştan kalandan düşer (satış ise eklenir)
    var goldNet = ((STATE.gold&&STATE.gold.entries&&STATE.gold.entries[key])||[]).reduce(function(a,x){return a+Number(x.qty||0)*Number(x.price||0);},0);
    var netKalan = gelir - debtDue - faturaTotal - expTotal - offTotal - savDep - goldNet;
    return {gelir:gelir, debtDue:debtDue, faturaTotal:faturaTotal, expTotal:expTotal, offTotal:offTotal, savDep:savDep, goldNet:goldNet, netKalan:netKalan};
  }

  function fieldIsOverriddenSalary(field,key){
    var m = STATE.salaryDefaultByMonth[key];

  }

  var GROUP_LABELS = {kredi_karti:'Kredi Kartları', kmh:'KMH Hesapları', kredi:'Krediler', manuel:'Manuel Takip'};
  var GROUP_ORDER = ['kredi_karti','kmh','kredi','manuel'];
  function sortedVisibleDebts(){
    return sortedVisible(STATE.debts).sort(function(a,b){
      var ga=GROUP_ORDER.indexOf(a.tur); if(ga===-1) ga=99;
      var gb=GROUP_ORDER.indexOf(b.tur); if(gb===-1) gb=99;
      if(ga!==gb) return ga-gb;
      return (a.sortOrder||0)-(b.sortOrder||0);
    });
  }

  function debtGroupHas(tur){ return STATE.debts.some(function(d){ return !d.hidden && d.tur===tur; }); }

    var tur = DEBT_SECS[id];
    if(debtGroupHas(tur)) return true;
    // hiç borç yoksa, ekleme yolu kalsın diye yalnız Kredi Kartları bölümü görünür
    return id==='kk' && !Object.keys(DEBT_SECS).some(function(i){ return debtGroupHas(DEBT_SECS[i]); });
  }

    });

  function limitMonthHtml(d, key, ser, bal){
    if((d.tur!=='kredi_karti' && d.tur!=='kmh') || !(Number(d.limit)>0)) return '';
    var pendO = (ser.pendOut && ser.pendOut[key]) || 0;
    var odendi = !!(d.paidMonths && d.paidMonths[key]);
    var odeme = (ser.paid && ser.paid[key]) || 0;
    // Ödeme yapıldıysa (yeşil tik) limit ödeme kadar boşalır; yapılmadıysa borç ödeme öncesi haliyle sayılır.
    var used = Math.max(0,bal) + pendO + (odendi ? 0 : odeme);
    var lim = Number(d.limit), left = lim - used;
    return '<div class="debt-sub" style="margin-top:6px; '+(left<0?'color:var(--red);':'')+'">'+(left<0 ? 'limit aşımı '+fmtShort(-left) : 'kalan limit '+fmtShort(left))+' <span style="color:var(--text-faint);">/ limit '+fmtShort(lim)+'</span><br><span style="color:var(--text-faint);">'+(odendi?'ödeme yapıldı, bu ayın harcaması dahil':'ödeme henüz işaretlenmedi, borç ödeme öncesi')+'</span></div>';
  }
  function paidTickBtn(list,id,key,paidMonths){

  /* ===================== BORÇLAR EKRANI ===================== */
  function renderBorclar(){
    captureAcc('s-borclar');
    var openKey = firstOpenKey(STATE, homeHorizon());
    var closedUpto = addMonths(openKey,-1);
    var totalStart = totalStartValue(STATE);
    var kalan = 0;
    STATE.debts.concat(STATE.ekBorclular).forEach(function(d){ kalan += itemBalanceAt(d, closedUpto); });
    var pct = totalStart>0 ? Math.max(0,Math.min(100,Math.round((1-(kalan/totalStart))*100))) : 0;
    var count = sortedVisible(STATE.debts).length + sortedVisible(STATE.ekBorclular).length;

    function startOptions(sel){
      var opts = '';
      for(var i=0;i<60;i++){ var k = keyFromAbsIndex(i); opts += '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+monthNameFromKey(k)+' '+yearFromKey(k)+'</option>'; }
      return opts;
    }
    function installmentInfo(d, bal){
      if(d.tur!=='kredi') return null;
      var tk = Number(fieldMonthly(d,'taksit',openKey)||d.taksit||0);
      if(!(tk>0) || !(d.baslangic>0)) return null;
      var total = Math.max(1, Math.ceil(d.baslangic/tk - 0.01));
      var done = Math.max(0, Math.min(total, Math.floor((d.baslangic-bal)/tk + 0.01)));
      return {done:done, total:total, left:total-done};
    }
    function cardHtml(listName, d, badge){
      var bal = itemBalanceAt(d, closedUpto);
      var ins = installmentInfo(d, bal);
      var pill = ins ? '<span class="tk-pill" title="'+ins.done+' / '+ins.total+' taksit ödendi">'+ins.done+'/'+ins.total+'</span>' : '';
      var leftTxt = ins ? ' · '+(ins.left>0 ? ins.left+' taksit kaldı' : 'taksitler bitti') : '';
      var p = d.baslangic>0 ? Math.max(0,Math.min(100,Math.round((1-(bal/d.baslangic))*100))) : 0;
      var f = 'data-action="debt-edit" data-list="'+listName+'" data-id="'+d.id+'"';
      var fields = '<label class="full">Ad<input type="text" '+f+' data-field="ad" value="'+esc(d.ad)+'"></label>'+
        '<label>Başlangıç tutarı<input type="text" inputmode="decimal" '+f+' data-field="baslangic" value="'+editVal(d.baslangic)+'"></label>'+
        '<label>Başlangıç ayı<select '+f+' data-field="startMonthKey">'+startOptions(d.startMonthKey)+'</select></label>';
      if(d.tur==='kredi') fields += '<label>Aylık taksit (varsayılan)<input type="text" inputmode="decimal" '+f+' data-field="taksit" value="'+editVal(d.taksit)+'"></label>';
      if(d.tur==='kredi_karti') fields += '<label>Asgari % (varsayılan)<input type="text" inputmode="decimal" '+f+' data-field="asgariYuzde" value="'+editVal(d.asgariYuzde)+'"></label>';
      if(d.tur==='kredi_karti' || d.tur==='kmh') fields += '<label>Limit (0 = yok)<input type="text" inputmode="decimal" '+f+' data-field="limit" value="'+editVal(d.limit)+'"></label>';
      if(d.tur==='kredi_karti' || d.tur==='kmh') fields += '<label>Faiz % (varsayılan)<input type="text" inputmode="decimal" '+f+' data-field="faizYuzde" value="'+editVal(d.faizYuzde)+'"></label>';
      var limHtml = '';
      if((d.tur==='kredi_karti'||d.tur==='kmh') && Number(d.limit)>0){
        var serL = calcDebtSeries(STATE,d,closedUpto), pendL = (serL.pendOut&&serL.pendOut[closedUpto])||0;
        var used = Math.max(0,bal+pendL), lim = Number(d.limit), over = used-lim;
        limHtml = '<div class="debt-sub" style="'+(over>0?'color:var(--red);':'')+'">'+(over>0 ? 'limit aşımı '+fmtShort(over) : 'kalan limit '+fmtShort(lim-used))+' / limit '+fmtShort(lim)+'</div>';
      }
      var done = bal<=0 && absIndexFromKey(d.startMonthKey) <= absIndexFromKey(closedUpto);
      return '<div class="debt-card"><div class="debt-top"><div style="min-width:0;"><div class="debt-name-input" style="font-weight:600;">'+esc(d.ad)+(done?' <span style="color:var(--acc); font-size:10px;">✓ bitti</span>':'')+'</div><div class="debt-badge">'+badge+' · başlangıç '+monthNameFromKey(d.startMonthKey)+' '+yearFromKey(d.startMonthKey)+'</div></div>'+
        '<div class="debt-bal">'+pill+fmt(bal)+'<div class="debt-sub">başlangıç '+fmtShort(d.baslangic)+'</div>'+limHtml+'</div></div>'+
        '<div class="prog-track"><div class="prog-fill" style="width:'+p+'%"></div></div>'+
        '<div class="debt-foot"><span class="edit-pill" data-action="toggle-rate-pop" data-for="ed_'+d.id+'">✎</span><span class="pct">%'+p+' ödendi'+leftTxt+'</span><span style="flex:1"></span>'+
          '<span class="move-btns h">'+moveBtnsInner(listName,d.id)+'</span>'+
          '<span class="hide-x" data-action="hide-item" data-list="'+listName+'" data-id="'+d.id+'" title="Gizle">🙈</span>'+
          '<span class="del-x" data-action="del" data-list="'+listName+'" data-id="'+d.id+'">✕</span></div>'+
        '<div class="rate-pop" id="ed_'+d.id+'"><div class="edit-grid">'+fields+'</div></div></div>';
    }

    var body = '';
    var B_ICO = {kredi_karti:'💳', kmh:'🏦', kredi:'🏷️', manuel:'✍️', ek:'🤝'};
    function groupAcc(accId, ico, name, now, start, inner){
      return '<details class="acc" data-acc="b_'+accId+'"><summary><span class="acc-name"><span class="acc-ico">'+ico+'</span>'+name+'</span><span class="acc-right"><span class="acc-amt">'+fmtShort(now)+'</span><span class="acc-chev">›</span></span></summary>'+
        '<div class="acc-body"><div class="year-note" style="margin-top:10px;">Başlangıç <b>'+fmtShort(start)+'</b> · şu an kalan <b>'+fmtShort(now)+'</b></div>'+inner+'</div></details>';
    }
    GROUP_ORDER.forEach(function(tur){
      var items = sortedVisibleDebts().filter(function(d){ return d.tur===tur; });
      if(!items.length) return;
      var grpStart = 0, grpNow = 0, inner = '';
      items.forEach(function(d){
        grpStart += Number(d.baslangic||0); grpNow += itemBalanceAt(d, closedUpto);
        var extra = d.tur==='kredi_karti' ? 'asg %'+fieldMonthly(d,'asgariYuzde',currentMonthKey)+' · faiz %'+fieldMonthly(d,'faizYuzde',currentMonthKey)
          : d.tur==='kmh' ? 'faiz %'+fieldMonthly(d,'faizYuzde',currentMonthKey)
          : d.tur==='kredi' ? 'taksit '+fmtShort(fieldMonthly(d,'taksit',currentMonthKey)) : 'manuel takip';
        inner += cardHtml('debts', d, extra);
      });
      body += groupAcc(tur, B_ICO[tur]||'💳', GROUP_LABELS[tur], grpNow, grpStart, inner);
    });
    var ekItems = sortedBySortOrder(sortedVisible(STATE.ekBorclular));
    if(ekItems.length){
      var eStart = 0, eNow = 0, eInner = '';
      ekItems.forEach(function(d){ eStart += Number(d.baslangic||0); eNow += itemBalanceAt(d, closedUpto); eInner += cardHtml('ekBorclular', d, 'MANUEL TAKİP'); });
      body += groupAcc('ek', B_ICO.ek, 'Ek Borçlular', eNow, eStart, eInner);
    }

    var html = ''+
    '<div class="month-head" style="margin-top:4px;"><div class="month-title" style="font-size:20px;">Tüm Borçlar</div><div class="month-chip">'+count+' kalem</div></div>'+
    '<div class="hero-card" style="padding:16px 18px; margin-top:10px;"><div class="hero-prog" style="margin-top:0;"><div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'+
      '<div class="meta"><span>Başlangıç: <b>'+fmtShort(totalStart)+'</b></span><span>Şu An Kalan: <b style="color:var(--text)">'+fmtShort(kalan)+'</b></span></div></div>'+
      '<div style="font-size:10px; color:var(--text-faint); margin-top:9px;">Tiklediğin ödemelere göre · '+monthNameFromKey(openKey)+' henüz kapanmadı</div></div>'+
    body+hiddenPanelHtml()+
    '<button class="add-row-btn" data-action="hide-done">🙈 Biten borçları gizle</button>'+
    '<button class="add-row-btn" style="margin-top:8px;" data-action="open-add-debt">+ Borç Ekle</button><div id="addDebtSlot2"></div>'+
    '<button class="add-row-btn" style="margin-top:8px;" data-action="add-ek">+ Ek Borçlu Ekle</button>';

    document.getElementById('s-borclar').innerHTML = html;
    restoreAcc('s-borclar');
  }


  /* ===================== RAPOR (aylık / yıllık) ===================== */
  var rpMode = 'm', rpKey = null, rpYear = null, rpMsg = '';
  function rpInit(){ if(!rpKey){ rpKey = nowKey(); rpYear = yearFromKey(rpKey); } }
  function monthDebtBalance(key){
    var bal = 0;
    sortedVisible(STATE.debts).forEach(function(d){ if(absIndexFromKey(key) < absIndexFromKey(d.startMonthKey)) return; bal += Math.max(0, calcDebtSeries(STATE,d,key).balances[key]||0); });
    sortedVisible(STATE.ekBorclular).forEach(function(d){ if(absIndexFromKey(key) < absIndexFromKey(d.startMonthKey)) return; bal += Math.max(0, calcEkSeries(STATE,d,key).balances[key]||0); });
    return bal;
  }
  function monthReportData(key){
    var t = computeMonthTotals(key), st = absIndexFromKey(key);
    var d = {t:t, exp:[], fat:[], off:[], debts:[], ek:[]};
    STATE.expenses.forEach(function(e){ if(st < absIndexFromKey(e.startMonthKey||EPOCH_KEY)) return; var a = billAmountForMonth(e,key); if(a) d.exp.push([e.ad, a]); });
    STATE.faturalar.forEach(function(f){ if(st < absIndexFromKey(f.startMonthKey||EPOCH_KEY)) return; if((f.cardTransfers||{})[key]) return; var a = billAmountForMonth(f,key); if(a) d.fat.push([f.ad, a]); });
    (STATE.offBudgetExpenses[key]||[]).forEach(function(i){ if(i.cardTransfer) return; var a = Number(i.tutar||0); if(a) d.off.push([i.ad||'Gider', a]); });
    sortedVisible(STATE.debts).forEach(function(x){ if(st < absIndexFromKey(x.startMonthKey)) return; var ser = calcDebtSeries(STATE,x,key); d.debts.push([x.ad, ser.paid[key]||0, ser.balances[key]||0, x.tur]); });
    sortedVisible(STATE.ekBorclular).forEach(function(x){ if(st < absIndexFromKey(x.startMonthKey)) return; var ser = calcEkSeries(STATE,x,key); d.ek.push([x.ad, ser.paid[key]||0, ser.balances[key]||0]); });

        if(String(t.value).trim()==='') delete dB.balanceOverrides[t.dataset.key];
        else dB.balanceOverrides[t.dataset.key] = Math.max(0, parseNum(t.value));

  function moveItem(listName, id, dir){
    var list = findList(listName); if(!list) return;
    var sorted = sortedBySortOrder(list);
    sorted.forEach(function(x,i){ x.sortOrder = i; });
    var i = sorted.findIndex(function(x){return x.id===id;});
    if(i<0) return;
    var j = i+dir;
    while(j>=0 && j<sorted.length && (sorted[j].hidden || (listName==='debts' && sorted[j].tur!==sorted[i].tur))) j += dir;
    if(j<0 || j>=sorted.length) return;
    var tmp = sorted[i].sortOrder; sorted[i].sortOrder = sorted[j].sortOrder; sorted[j].sortOrder = tmp;
    save(); renderAll();
  }

  function quickAddSave(kind, key){
    var adEl = document.getElementById('qaAd'), amtEl = document.getElementById('qaAmt'), repEl = document.getElementById('qaRep');
    var defName = kind==='expense' ? 'Yeni Gider' : (kind==='bill' ? 'Yeni Fatura' : 'Yeni Harcama');
    var ad = (adEl && adEl.value.trim()) || defName;
    var amt = Math.max(0, parseNum(amtEl ? amtEl.value : 0));
    var rep = !!(repEl && repEl.checked);
    if(kind==='bill' || kind==='expense'){
      var list = kind==='bill' ? STATE.faturalar : STATE.expenses;
      var o = {id:uid(), ad:ad, monthlyAmounts:{}, cardTransfers:{}, paidMonths:{}, startMonthKey:key, sortOrder:list.length, repeat:rep, repeatAmount:amt};
      if(!rep) o.monthlyAmounts[key] = amt;
      list.push(o);
    } else if(rep){
      STATE.recurringOb.push({id:uid(), ad:ad, tutar:amt, startMonthKey:key, endMonthKey:null, skip:{}});
      ensureRecurring(STATE);
    } else {
      if(!STATE.offBudgetExpenses[key]) STATE.offBudgetExpenses[key] = [];
      STATE.offBudgetExpenses[key].push({id:uid(), ad:ad, tutar:amt, paid:false});
    }
    save(); renderAll();
  }

  // Tekrar eden kalemlerde: "bu tutarı sonrakilere uygula" ve "tekrarı durdur"
  function repeatAction(action, listName, id, key){
    if(listName==='ob'){
      var item = (STATE.offBudgetExpenses[key]||[]).filter(function(x){return x.id===id;})[0];
      var tpl = item && STATE.recurringOb.filter(function(x){return x.id===item.recurId;})[0];
      if(!tpl) return;
      if(action==='rep-apply'){
        var amtO = item.cardTransfer ? Number(item.cardTransfer.amount||0) : Number(item.tutar||0);
        tpl.tutar = amtO;
        Object.keys(STATE.offBudgetExpenses).forEach(function(k){
          if(absIndexFromKey(k) <= absIndexFromKey(key)) return;
          STATE.offBudgetExpenses[k].forEach(function(x){ if(x.recurId===tpl.id && !x.paid && !x.cardTransfer) x.tutar = amtO; });
        });
      } else {
        tpl.endMonthKey = key;
        Object.keys(STATE.offBudgetExpenses).forEach(function(k){
          if(absIndexFromKey(k) <= absIndexFromKey(key)) return;
          STATE.offBudgetExpenses[k] = STATE.offBudgetExpenses[k].filter(function(x){ return !(x.recurId===tpl.id && !x.paid && !x.cardTransfer); });
        });
      }
      save(); renderAll(); return;
    }
    var it = findList(listName).filter(function(x){return x.id===id;})[0];
    if(!it) return;
    it.monthlyAmounts = it.monthlyAmounts||{};
    var start = it.startMonthKey||EPOCH_KEY;
    // Geçmiş aylar değişmesin diye, bu aya kadar olan tutarları sabitle
    keysBetween(start, key).forEach(function(k){
      if(!hasOwn(it.monthlyAmounts,k)) it.monthlyAmounts[k] = billAmountForMonth(it,k);
    });
    if(action==='rep-apply'){
      var tr = (it.cardTransfers||{})[key];
      var amt = tr ? Number(tr.amount||0) : billAmountForMonth(it,key);
      it.repeat = true; it.repeatAmount = amt;
      Object.keys(it.monthlyAmounts).forEach(function(k){
        if(absIndexFromKey(k) > absIndexFromKey(key) && !(it.cardTransfers && it.cardTransfers[k])) delete it.monthlyAmounts[k];
      });
    } else {
      it.repeat = false;
    }
    save(); renderAll();
  }

  function hexA(hex, a){
    var h = String(hex||'').replace('#',''); if(h.length===3) h = h.split('').map(function(c){return c+c;}).join('');
    var n = parseInt(h,16); if(isNaN(n)) return 'rgba(212,255,63,'+a+')';
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }
  function applyTheme(){
    var th = THEMES[(STATE.theme&&STATE.theme.name)] || THEMES.siyah;
    var c = (STATE.theme&&STATE.theme.accent) || th.accents[0];
    var st = document.documentElement.style;
    st.setProperty('--bg', th.bg); st.setProperty('--surface', th.surface); st.setProperty('--surface2', th.surface2);
    st.setProperty('--line', th.line); st.setProperty('--text', th.text); st.setProperty('--text-dim', th.dim); st.setProperty('--text-faint', th.faint);
    st.setProperty('--ink', th.ink); st.setProperty('--red', th.red); st.setProperty('--amber', th.amber);
    st.setProperty('--on-acc', th.onAcc); st.setProperty('--tabbar', th.tabbar);
    st.setProperty('--acc', c); st.setProperty('--acc-dim', hexA(c,.16));
    var meta = document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content', th.meta);
    renderThemePickers();
  }
  function renderThemePickers(){
    var cur = (STATE.theme&&STATE.theme.name) || 'siyah';
    var th = THEMES[cur] || THEMES.siyah, acc = (STATE.theme&&STATE.theme.accent) || th.accents[0];
    var tr = document.getElementById('themeRow');
    if(tr) tr.innerHTML = THEME_ORDER.map(function(id){
      var t = THEMES[id];
      return '<button type="button" class="theme-card'+(id===cur?' active':'')+'" data-theme="'+id+'"><span class="theme-dots"><i style="background:'+t.bg+'"></i><i style="background:'+t.surface+'"></i><i style="background:'+t.surface2+'"></i><i style="background:'+t.accents[0]+'"></i></span>'+t.label+'</button>';
    }).join('');
    var sr = document.getElementById('swatchRow');
    if(sr) sr.innerHTML = th.accents.map(function(c){
      return '<button type="button" class="swatch'+(c.toLowerCase()===String(acc).toLowerCase()?' active':'')+'" style="background:'+c+';" data-c="'+c+'"></button>';
    }).join('');
  }
  document.getElementById('themeRow').addEventListener('click', function(e){
    var b = e.target.closest('[data-theme]'); if(!b) return;
    STATE.theme.name = b.dataset.theme; STATE.theme.accent = THEMES[b.dataset.theme].accents[0];
    applyTheme(); renderAll(); save();
  });
  document.getElementById('swatchRow').addEventListener('click', function(e){
    var b = e.target.closest('[data-c]'); if(!b) return;
    STATE.theme.accent = b.dataset.c; applyTheme(); renderAll(); save();
  });
  var exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download='private-ledger-yedek.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });
  var importInput = document.getElementById('importInput');
  if(importInput) importInput.addEventListener('change', function(){
    var file = importInput.files && importInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{ STATE = normalizeState(JSON.parse(ev.target.result)); save(); renderAll(); applyTheme(); alert('Yedek yüklendi.'); }
      catch(err){ alert('Dosya okunamadı.'); }
    };
    reader.readAsText(file);
    importInput.value='';
  });

  if(syncDotEl) syncDotEl.addEventListener('click', function(){
    if(syncDotEl.classList.contains('error')){
      alert('⚠ Buluta ulaşılamıyor\n\nHata: '+lastSyncErrorDetail+'\n\nVerilerin bu cihazda güvende. Şimdi tekrar deniyorum…');
    }
    refreshFromCloud(true);
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshFromCloud(false); });
  window.addEventListener('focus', function(){ refreshFromCloud(false); });
  setInterval(function(){ if(!document.hidden) refreshFromCloud(false); }, 25000);

  /* ===================== GÖRÜNÜR ALANA SABİTLE ===================== */
  // Telefon tarayıcılarında vh/dvh ölçüsü, adres çubuğu ve klavye yüzünden görünür alandan farklı olabiliyor.
  // Uygulama kabuğunu gerçek görünür alana (visualViewport) kilitliyoruz; üst/alt çubuk hep ekranda kalır.
  var phoneEl = document.getElementById('phone');
  function fitApp(){
    var vv = window.visualViewport;
    var h = window.innerHeight, top = 0;
    if(vv && vv.scale <= 1.02){ h = vv.height; top = vv.offsetTop; }
    document.documentElement.style.setProperty('--app-h', Math.round(h)+'px');
    phoneEl.style.top = Math.round(top)+'px';
    if(window.scrollY) window.scrollTo(0,0);
  }
  window.addEventListener('resize', fitApp);
  window.addEventListener('orientationchange', function(){ setTimeout(fitApp,200); });
  window.addEventListener('scroll', fitApp);
  document.addEventListener('focusout', function(){ setTimeout(fitApp,150); });
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', fitApp); window.visualViewport.addEventListener('scroll', fitApp); }
  fitApp();

  /* ===================== BAŞLAT ===================== */
  var APP_VERSION = 'v31';
  (function(){
    var v = document.getElementById('appVer'); if(v) v.textContent = APP_VERSION;
    var ub = document.getElementById('updateBtn');
    if(ub) ub.addEventListener('click', async function(){
      ub.textContent = 'Güncelleniyor…';
      try{
        if('serviceWorker' in navigator){ var regs = await navigator.serviceWorker.getRegistrations(); for(var i=0;i<regs.length;i++) await regs[i].unregister(); }
        if(window.caches){ var ks = await caches.keys(); for(var j=0;j<ks.length;j++) await caches.delete(ks[j]); }
      }catch(e){}
      location.reload();
    });
  })();
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
  try{ var _l0 = loadLocalState(); if(_l0){ STATE.theme = _l0.theme; } }catch(e){}
  applyTheme();
  loadFromSupabase().then(function(){
    currentMonthKey = homeKey();
    currentPickerYear = yearFromKey(currentMonthKey);
    applyTheme();
    renderAll();
    autoFund();
  });

})();
</script>
</body>
</html>
